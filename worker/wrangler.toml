name = "fieldtalk-ai"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
CORS_ORIGIN = "https://toolbox.nickrogoff.com"
DAILY_LIMIT = "20"
OPENAI_MODEL = "gpt-5.4-mini"
# OSHA retrieval: must match the embedding model used by scripts/sync-osha-standards.mjs
OPENAI_EMBEDDING_MODEL = "text-embedding-3-small"
# Cosine-similarity floor for pulling standards into the prompt; raise toward 0.5
# if irrelevant standards appear on vague descriptions, lower toward 0.3 if
# clearly relevant ones are missed.
OSHA_MATCH_THRESHOLD = "0.40"
OSHA_MATCH_COUNT = "4"
RESEND_FROM_NAME = "Field Talk"
RESEND_FROM_EMAIL = "no-reply@safetynetdispatch.com"
# Store the API key with: wrangler secret put RESEND_API_KEY
