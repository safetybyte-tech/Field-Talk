name: Delivery release gate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delivery-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # This asserts the required behavior. It currently fails on duplicate send;
      # it is deliberately neither skipped nor marked as an expected failure.
      - run: npm run test:acceptance -- --project=chromium --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-release-evidence
          path: acceptance-results/
          retention-days: 14
